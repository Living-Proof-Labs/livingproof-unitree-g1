# SPDX-License-Identifier: Apache-2.0
# walk-hallway verification chain, owned by capability-verifier's reusable workflow:
# plan (refs from verification.lock.json) -> evidence per configuration -> verify -> report
# -> PR comment. A capability FAIL is the result, not a CI failure.
# The uses: commit must be the verifier release named in verification.lock.json
# (repin --check enforces that the lock is released; bump both together).
name: Verify
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  walk-hallway:
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@97bcf91fa022f2167f6dc90e47b60a7f06a54f4a
    permissions:
      contents: read
      pull-requests: write
  release:
    # semantic-release.yml@v3.0.0 analyzes conventional commits, then tags
    # v${version} and publishes a GitHub release. It does not write a version
    # into pyproject.toml. GITHUB_TOKEN only.
    needs: walk-hallway
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v3.0.0
