[project]
name = "livingproof-unitree-g1"
version = "0.1.0"
description = "Unitree G1 robot package: pinned model, published controllers and the MuJoCo adapter"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mujoco==3.17.0",
    "numpy==2.4.6; python_version < '3.12'",
    "numpy==2.5.4; python_version >= '3.12'",
    "pyyaml==6.0.3",
    "imageio[ffmpeg]==2.38.1",
    "livingproof-sim-mujoco[torch,media]",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpl_g1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# Released simulator the adapter tests import. A tag, not a branch or an unreleased commit.
livingproof-sim-mujoco = { git = "https://github.com/Living-Proof-Labs/livingproof-sim-mujoco.git", tag = "v3.0.7" }

[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.livingproof]
adapter = "lpl_g1.adapter:ROBOT"
