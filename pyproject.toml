[project]
name = "livingproof-unitree-g1"
dynamic = ["version"]
description = "Unitree G1 robot package: pinned model, published controllers and the MuJoCo adapter"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mujoco==3.17.0",
    "numpy==2.4.6; python_version < '3.12'",
    "numpy==2.5.4; python_version >= '3.12'",
    "pyyaml==6.0.3",
    "imageio[ffmpeg]==2.38.1",
    "livingproof-sim-mujoco[torch,media]",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

# The version is the release tag (semantic-release tags v${version}); a commit after a
# tag reports the next development version. A source archive (a GitHub release tarball or
# git archive) has no .git, so .git_archival.txt (export-subst) carries the tag instead.
# Only a build with neither reports 0.0.0.
[tool.hatch.version]
source = "vcs"
[tool.hatch.version.raw-options]
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/lpl_g1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# Rebuild the editable install's metadata when the commit or the tags change.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# Released simulator the adapter tests import. A tag, not a branch or an unreleased commit.
livingproof-sim-mujoco = { git = "https://github.com/Living-Proof-Labs/livingproof-sim-mujoco.git", tag = "v3.1.4" }

[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.livingproof]
adapter = "lpl_g1.adapter:ROBOT"
