# SPDX-License-Identifier: Apache-2.0
version: '3'
vars:
  CONFIGURATION: '{{.CONFIGURATION | default "playground"}}'
env:
  MUJOCO_GL: osmesa
  PYOPENGL_PLATFORM: osmesa
tasks:
  setup:
    desc: Install dependencies (uv) and download the pinned upstream files
    cmds:
      - uv sync
      - task: fetch
  fetch:
    desc: Download every pin in pins.json into .cache/ and verify its sha256
    cmds: [uv run python -m lpl_g1.fetch]
  check:
    desc: Lint, formatting, and robot/configuration profiles against the pinned v1.5.0 schemas
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - 'uv run python -c "from lpl_g1.profiles import robot, configuration; [configuration(c[\"name\"]) for c in robot()[\"configurations\"]]; print(\"profiles valid\")"'
  test:
    desc: Schemas, pins, gains vs upstream, scenario parameters, lock, repin, scene, PD
    cmds: [uv run pytest tests --junitxml=artifacts/tests.xml]
  reference:
    desc: Tick-by-tick match against play_g1_joystick.py (playground) and deploy_mujoco.py + g1.yaml (stock)
    cmds: [uv run python -m lpl_g1.reference]
  evidence:
    desc: "walk-hallway sim evidence for one configuration, no grading: task evidence CONFIGURATION=<name>"
    cmds: ['uv run python -m lpl_g1.evidence {{.CONFIGURATION}} artifacts/evidence/{{.CONFIGURATION}} {{.CLI_ARGS}}']
  stand:
    desc: "Zero-command standing check: task stand CONFIGURATION=<name>"
    cmds: ['uv run python -m lpl_g1.walk stand --configuration {{.CONFIGURATION}}']
  repin:
    desc: "Fill PENDING_RELEASE refs from real tags: task repin -- runner=v1.4.0 verifier=vX.Y.Z reporter=vX.Y.Z"
    cmds: ['python3 tools/repin.py {{.CLI_ARGS}}']
  repin:check:
    desc: Fail while verification.lock.json has PENDING_RELEASE refs or the runner is not on its locked tag
    cmds: [python3 tools/repin.py --check]
  profile:measure:
    desc: Measure robot width, length and mass from the pinned model (robot.json dimensions)
    cmds: [uv run python -m lpl_g1.measure]
  profile:stand:
    desc: Measure each configuration's nominal base height (zero-command stand)
    cmds:
      - for: [stock, playground]
        task: stand
        vars: {CONFIGURATION: '{{.ITEM}}'}
